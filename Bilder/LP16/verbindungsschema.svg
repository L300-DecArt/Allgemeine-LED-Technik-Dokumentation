<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1060" height="620" fill="#ffffff"/>

  <!-- ===================== STANDARD ===================== -->
  <text x="20" y="34" font-size="20" font-weight="bold" fill="#111">Standard: Kabel haben an BEIDEN Enden Clips – Geräte haben Buchsen ohne Clip</text>
  <text x="20" y="56" font-size="13" fill="#555">Datenrichtung von links nach rechts.  Ausgang = W (weiblich, Löcher)   Eingang = M (männlich, Stifte)</text>

  <!-- Hinterlegung je Steckverbindung -->
  <rect x="134" y="100" width="132" height="145" rx="10" fill="#e6f4ea"/>
  <rect x="372" y="100" width="132" height="145" rx="10" fill="#e6f4ea"/>
  <rect x="610" y="100" width="132" height="145" rx="10" fill="#e6f4ea"/>
  <rect x="852" y="100" width="74" height="145" rx="10" fill="#e6f4ea"/>

  <!-- Controllerbox -->
  <rect x="20" y="105" width="120" height="90" rx="6" fill="#e9ecef" stroke="#444" stroke-width="2"/>
  <text x="76" y="145" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Controller-</text>
  <text x="76" y="163" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">box</text>
  <rect x="140" y="130" width="26" height="40" rx="3" fill="#2b2b2b"/>
  <text x="153" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>

  <!-- Kabel 1 -->
  <rect x="200" y="132" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="212" y="119" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="229" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <line x1="258" y1="150" x2="380" y2="150" stroke="#111" stroke-width="8"/>
  <text x="319" y="138" font-size="13" text-anchor="middle" fill="#333">Kabel</text>
  <rect x="380" y="132" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="392" y="119" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="409" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>

  <!-- Geraet mit Gehaeuse -->
  <rect x="486" y="105" width="140" height="90" rx="6" fill="#e9ecef" stroke="#444" stroke-width="2"/>
  <rect x="470" y="130" width="26" height="40" rx="3" fill="#2b2b2b"/>
  <text x="483" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <rect x="616" y="130" width="26" height="40" rx="3" fill="#2b2b2b"/>
  <text x="629" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>
  <circle cx="532" cy="124" r="5" fill="#ff4d6d"/>
  <circle cx="548" cy="124" r="5" fill="#ffd166"/>
  <circle cx="564" cy="124" r="5" fill="#06d6a0"/>
  <circle cx="580" cy="124" r="5" fill="#4cc9f0"/>
  <text x="556" y="152" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">LED-Element</text>
  <text x="556" y="169" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">mit Gehäuse</text>

  <!-- Kabel 2 -->
  <rect x="676" y="132" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="688" y="119" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="705" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <line x1="734" y1="150" x2="860" y2="150" stroke="#111" stroke-width="8"/>
  <text x="797" y="138" font-size="13" text-anchor="middle" fill="#333">Kabel</text>
  <rect x="860" y="132" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="872" y="119" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="889" y="156" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>
  <text x="986" y="146" font-size="13" text-anchor="middle" fill="#333">nächstes</text>
  <text x="986" y="163" font-size="13" text-anchor="middle" fill="#333">Gerät …</text>

  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="153" y="218">Buchse W</text><text x="153" y="233" fill="#1b7f3b" font-weight="bold">ohne Clip</text>
    <text x="229" y="218">Stecker M</text><text x="229" y="233" fill="#c45f00" font-weight="bold">MIT Clip</text>
    <text x="409" y="218">Stecker W</text><text x="409" y="233" fill="#c45f00" font-weight="bold">MIT Clip</text>
    <text x="483" y="218">Buchse M</text><text x="483" y="233" fill="#1b7f3b" font-weight="bold">ohne Clip</text>
    <text x="629" y="218">Buchse W</text><text x="629" y="233" fill="#1b7f3b" font-weight="bold">ohne Clip</text>
    <text x="705" y="218">Stecker M</text><text x="705" y="233" fill="#c45f00" font-weight="bold">MIT Clip</text>
    <text x="889" y="218">Stecker W</text><text x="889" y="233" fill="#c45f00" font-weight="bold">MIT Clip</text>
  </g>
  <rect x="20" y="258" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#1b7f3b"/>
  <text x="42" y="270" font-size="13" fill="#1b7f3b">= eine Steckverbindung: immer genau eine Seite MIT Clip (Kabel) und eine Seite OHNE Clip (Gerät) – und immer M in W</text>

  <g transform="translate(0,24)">
  <!-- ===================== GERAET MIT FESTEM KABEL ===================== -->
  <line x1="20" y1="276" x2="1040" y2="276" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="308" font-size="20" font-weight="bold" fill="#111">Gerät mit fest angeschlossenen Kabeln (ohne Gehäusebuchsen)</text>
  <text x="20" y="330" font-size="13" fill="#555">Das fest angeschlossene Kabelende gehört zum Gerät – es bekommt deshalb eine Kupplung OHNE Clip, genau wie eine Einbaubuchse.</text>

  <rect x="136" y="365" width="150" height="122" rx="10" fill="#e6f4ea"/>
  <rect x="612" y="365" width="150" height="122" rx="10" fill="#e6f4ea"/>

  <!-- Kabel davor -->
  <line x1="20" y1="415" x2="150" y2="415" stroke="#111" stroke-width="8"/>
  <text x="80" y="403" font-size="13" text-anchor="middle" fill="#333">Kabel</text>
  <rect x="150" y="397" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="162" y="384" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="179" y="421" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>

  <!-- Geraetekabel Eingang: Kupplung M ohne Clip -->
  <rect x="220" y="397" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <text x="249" y="421" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <line x1="278" y1="415" x2="340" y2="415" stroke="#111" stroke-width="8"/>
  <rect x="340" y="398" width="200" height="34" rx="4" fill="#fafafa" stroke="#444" stroke-width="2"/>
  <circle cx="370" cy="415" r="6" fill="#ff4d6d"/>
  <circle cx="405" cy="415" r="6" fill="#ffd166"/>
  <circle cx="440" cy="415" r="6" fill="#06d6a0"/>
  <circle cx="475" cy="415" r="6" fill="#4cc9f0"/>
  <circle cx="510" cy="415" r="6" fill="#c77dff"/>
  <text x="440" y="389" font-size="13" text-anchor="middle" fill="#333">LED-Element mit festen Kabeln</text>
  <line x1="540" y1="415" x2="626" y2="415" stroke="#111" stroke-width="8"/>
  <!-- Geraetekabel Ausgang: Kupplung W ohne Clip -->
  <rect x="626" y="397" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <text x="655" y="421" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">W</text>

  <!-- Kabel danach -->
  <rect x="696" y="397" width="58" height="36" rx="8" fill="#2b2b2b"/>
  <rect x="708" y="384" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="725" y="421" font-size="15" font-weight="bold" text-anchor="middle" fill="#fff">M</text>
  <line x1="754" y1="415" x2="860" y2="415" stroke="#111" stroke-width="8"/>
  <text x="807" y="403" font-size="13" text-anchor="middle" fill="#333">Kabel</text>

  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="179" y="457">Stecker W</text><text x="179" y="472" fill="#c45f00" font-weight="bold">MIT Clip</text>
    <text x="249" y="457">Kupplung M</text><text x="249" y="472" fill="#1b7f3b" font-weight="bold">ohne Clip</text>
    <text x="655" y="457">Kupplung W</text><text x="655" y="472" fill="#1b7f3b" font-weight="bold">ohne Clip</text>
    <text x="725" y="457">Stecker M</text><text x="725" y="472" fill="#c45f00" font-weight="bold">MIT Clip</text>
  </g>

  <rect x="20" y="500" width="1020" height="46" rx="6" fill="#fff4e5" stroke="#f28c28" stroke-width="2"/>
  <text x="36" y="520" font-size="14" font-weight="bold" fill="#8a4500">Merksatz:</text>
  <text x="112" y="520" font-size="14" fill="#333">Lose Kabel = Clips an beiden Enden.  Alles, was fest zum Gerät gehört (Einbaubuchse oder festes Kabelende) = OHNE Clip.</text>
  <text x="112" y="538" font-size="13" fill="#8a4500">Niemals Kupplungen ohne Clip an lose Kabel bauen – sonst passen sie nicht mehr an die Gerätebuchsen.</text>

  </g>
  <!-- Legende -->
  <rect x="20" y="592" width="34" height="11" rx="2" fill="#f28c28" stroke="#b35f10"/>
  <text x="62" y="602" font-size="13" fill="#333">= Clip (Metall-Lasche mit „push“-Taste zum Entriegeln)</text>
  <text x="520" y="602" font-size="13" fill="#333">M = männlich (Stifte, Eingang)     W = weiblich (Löcher, Ausgang)</text>
</svg>
